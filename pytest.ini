[pytest]
# 只收集 tests/ 下的 pytest 用例。
#
# 仓库根目录的 test_vcpedia_schema.py / test_annotate_llm.py 是**脚本式自检**
# （打印 [OK]/[!!] 并汇总计数，靠退出码判断成败，用法见 README「本地测试」），
# 不是 pytest 套件，所以：
#   - 它们的用例函数一律 `case_*` 命名，pytest 收集不到
#     （否则 check() 只记录不 assert，断言全灭也会显示 passed——假绿）；
#   - 这里再用 testpaths 把默认收集范围收紧到 tests/，
#     避免 `pytest` 在根目录做无谓扫描。
# 两个脚本仍按文档用 `python test_xxx.py` 单独运行。
testpaths = tests
